server {
    listen 80;
    server_name laboutiquedellautoroma.it www.laboutiquedellautoroma.it;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name laboutiquedellautoroma.it www.laboutiquedellautoroma.it;

    ssl_certificate /etc/letsencrypt/live/laboutiquedellautoroma.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laboutiquedellautoroma.it/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
